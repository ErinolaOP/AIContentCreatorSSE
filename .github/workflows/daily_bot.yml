name: Daily Shorts Automation Bot

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies (FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Requirements
        run: pip install -r requirements.txt

      - name: Inject Secrets into Runner Environment
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CLIENT_SECRETS: ${{ secrets.CLIENT_SECRETS_JSON }}
          TOKEN_PICKLE: ${{ secrets.TOKEN_PICKLE_BASE64 }}
        run: |
          echo "$CLIENT_SECRETS" > client_secrets.json
          echo "$TOKEN_PICKLE" | base64 -d > token.pickle

      - name: Execute Content Creator Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python main.py
